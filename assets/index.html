<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>chat-tui · web</title>
  <style>
    /* ---------- design tokens ---------- */
    :root {
      color-scheme: dark light;
      --bg: #0b0e14;
      --surface: #11151d;
      --surface-2: #161b25;
      --surface-3: #1c2230;
      --border: #242c3a;
      --border-strong: #33405280;
      --text: #e6e9ef;
      --muted: #98a2b3;
      --faint: #6b7484;
      --accent: #4cc2ff;
      --accent-ink: #04121b;
      --accent-soft: #4cc2ff24;
      --danger: #ff6b6b;
      --warn: #ffc861;
      --ok: #4ade80;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow: 0 12px 32px #00000059;
      --ease: 160ms cubic-bezier(.2, .7, .3, 1);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --surface-2: #f1f4f8;
        --surface-3: #e7ecf3;
        --border: #dde3ec;
        --border-strong: #c6cfdd;
        --text: #131820;
        --muted: #5b6474;
        --faint: #8b95a6;
        --accent: #0b74b8;
        --accent-ink: #ffffff;
        --accent-soft: #0b74b814;
        --danger: #c92a2a;
        --warn: #9a6700;
        --ok: #1e7b3b;
        --shadow: 0 12px 32px #10182814;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    svg.icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }

    /* ---------- auth ---------- */
    .auth {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(70rem 40rem at 15% -10%, var(--accent-soft), transparent 60%),
        var(--bg);
    }

    .auth[hidden] {
      display: none;
    }

    .auth-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
    }

    .auth-sub {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }

    .field {
      display: block;
      margin-bottom: 14px;
    }

    .field span {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color var(--ease), background var(--ease);
    }

    input[type="text"]:hover,
    input[type="password"]:hover,
    textarea:hover {
      border-color: var(--border-strong);
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: var(--accent);
      background: var(--surface);
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: var(--radius);
      padding: 9px 14px;
      cursor: pointer;
      transition: background var(--ease), border-color var(--ease), transform var(--ease);
    }

    .btn:hover {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn[disabled] {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent);
      filter: brightness(1.08);
      border-color: var(--accent);
    }

    .btn-block {
      width: 100%;
      margin-top: 6px;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      padding: 6px;
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: transparent;
    }

    .switch-line {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .link {
      color: var(--accent);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .form-error {
      min-height: 20px;
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--danger);
    }

    /* ---------- shell ---------- */
    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      height: 100dvh;
      overflow: hidden;
    }

    .app[hidden] {
      display: none;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .side-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 10px;
    }

    .side-head .who {
      min-width: 0;
      flex: 1;
    }

    .side-head .who strong {
      display: block;
      font-size: 14px;
      font-weight: 620;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
      flex: none;
    }

    .dot[data-state="live"] {
      background: var(--ok);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
    }

    .dot[data-state="down"] {
      background: var(--warn);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      transition: background var(--ease), color var(--ease);
    }

    .tab:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .tab[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .pane {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px;
    }

    .pane[hidden] {
      display: none;
    }

    .new-conv {
      display: flex;
      gap: 8px;
      padding: 10px 12px 6px;
    }

    .new-conv .btn {
      width: 100%;
      justify-content: flex-start;
      color: var(--muted);
      background: var(--surface-2);
    }

    .conv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 9px 10px;
      cursor: pointer;
      transition: background var(--ease), border-color var(--ease);
    }

    .conv:hover {
      background: var(--surface-2);
    }

    .conv[aria-current="true"] {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .conv .title {
      font-weight: 560;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv .time {
      font-size: 11.5px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }

    .conv .preview {
      grid-column: 1 / -1;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv[data-unread="true"] .title {
      color: var(--text);
    }

    .conv[data-unread="true"] .title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 7px;
      vertical-align: 1px;
    }

    .badge {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- thread ---------- */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .thread-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      min-height: 57px;
    }

    .thread-head .peer {
      font-weight: 620;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-head .sub {
      font-size: 12.5px;
      color: var(--muted);
    }

    .back {
      display: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: min(680px, 88%);
      margin-top: 12px;
    }

    .msg[data-mine="true"] {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .msg[data-grouped="true"] {
      margin-top: 3px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 650;
      background: var(--surface-3);
      color: var(--muted);
      margin-top: 2px;
    }

    .msg[data-mine="true"] .avatar {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .msg[data-grouped="true"] .avatar {
      visibility: hidden;
      height: 0;
      margin: 0;
    }

    .bubble {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      border-top-left-radius: 5px;
      padding: 8px 12px;
    }

    .msg[data-mine="true"] .bubble {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: 5px;
    }

    .msg[data-grouped="true"] .bubble {
      border-top-left-radius: var(--radius-lg);
    }

    .msg[data-mine="true"][data-grouped="true"] .bubble {
      border-top-right-radius: var(--radius-lg);
      border-top-left-radius: var(--radius-lg);
    }

    .meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
      font-size: 12px;
    }

    .meta .who {
      font-weight: 620;
      color: var(--muted);
      max-width: 16ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta time {
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      font-size: 11.5px;
    }

    .msg[data-grouped="true"] .meta {
      display: none;
    }

    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg[data-failed="true"] .bubble {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
    }

    .msg[data-pending="true"] .text {
      opacity: .6;
    }

    .fail-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 12px;
      color: var(--danger);
    }

    .day {
      align-self: center;
      margin: 18px 0 4px;
      font-size: 11.5px;
      color: var(--faint);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .day::before,
    .day::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 34ch;
      display: grid;
      gap: 6px;
      padding: 24px;
    }

    .empty strong {
      color: var(--text);
      font-size: 15px;
    }

    /* ---------- composer ---------- */
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .composer textarea {
      resize: none;
      max-height: 160px;
      min-height: 42px;
      padding: 10px 12px;
      line-height: 1.45;
    }

    .composer .btn {
      height: 42px;
      padding: 0 14px;
    }

    /* ---------- friends ---------- */
    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 620;
      letter-spacing: .04em;
      color: var(--faint);
      text-transform: uppercase;
      padding: 14px 10px 6px;
    }

    .friend-row,
    .req-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
    }

    .friend-row:hover,
    .req-row:hover {
      background: var(--surface-2);
    }

    .friend-row .n,
    .req-row .n {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .req-row .reason {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex: none;
    }

    .row-actions .btn {
      padding: 5px 9px;
      font-size: 12.5px;
    }

    .hint {
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- dialog + toast ---------- */
    dialog {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius-lg);
      padding: 0;
      width: min(480px, calc(100vw - 32px));
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: #05070bcc;
      backdrop-filter: blur(2px);
    }

    .dlg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 620;
    }

    .dlg-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 12px;
    }

    .results {
      display: grid;
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 8px 10px;
      cursor: pointer;
    }

    .result:hover,
    .result[aria-selected="true"] {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 12px);
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease), transform var(--ease);
      max-width: calc(100vw - 32px);
    }

    .toast[data-show="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast[data-kind="error"] {
      border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      color: var(--danger);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .app[data-view="thread"] .sidebar {
        display: none;
      }

      .app[data-view="list"] .main {
        display: none;
      }

      .back {
        display: inline-grid;
      }

      .messages {
        padding: 14px 12px 4px;
      }

      .composer {
        padding: 10px 12px 14px;
      }

      .msg {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M4.5 12h13M12 6.5 17.5 12 12 17.5" />
    </symbol>
    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20" />
      <circle cx="9.5" cy="7.5" r="3.5" />
      <path d="M17 4.5a3.5 3.5 0 0 1 0 7M21 20v-1.5a4 4 0 0 0-3-3.8" />
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M15 5l-7 7 7 7" />
    </symbol>
    <symbol id="i-out" viewBox="0 0 24 24">
      <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h9" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5 10 17.5 19 7" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" />
    </symbol>
  </svg>

  <!-- ============ auth ============ -->
  <section class="auth" id="auth">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">c</span>
        <span>chat-tui</span>
      </div>
      <p class="auth-sub" id="authSub">登录后开始聊天。</p>

      <form id="authForm" novalidate>
        <label class="field">
          <span>用户名</span>
          <input type="text" id="authName" name="username" autocomplete="username" required
            autocapitalize="off" spellcheck="false">
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="authPassword" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit" id="authSubmit">登录</button>
        <p class="form-error" id="authError" role="alert"></p>
      </form>

      <p class="switch-line">
        <span id="switchPrompt">还没有账号？</span>
        <button class="link" type="button" id="switchMode">注册一个</button>
      </p>
    </div>
  </section>

  <!-- ============ app ============ -->
  <div class="app" id="app" data-view="list" hidden>
    <aside class="sidebar">
      <div class="side-head">
        <div class="who">
          <strong id="meName">—</strong>
          <span class="conn"><span class="dot" id="connDot" data-state="idle"></span><span
              id="connText">未连接</span></span>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" title="退出登录" aria-label="退出登录">
          <svg class="icon">
            <use href="#i-out" />
          </svg>
        </button>
      </div>

      <div class="tabs" role="tablist" aria-label="侧栏">
        <button class="tab" role="tab" id="tabChats" aria-selected="true" aria-controls="paneChats">消息</button>
        <button class="tab" role="tab" id="tabFriends" aria-selected="false" aria-controls="paneFriends">好友</button>
      </div>

      <div class="pane" id="paneChats" role="tabpanel" aria-labelledby="tabChats">
        <div class="new-conv">
          <button class="btn" id="newConvBtn">
            <svg class="icon">
              <use href="#i-plus" />
            </svg>
            开始新对话
          </button>
        </div>
        <div id="convList"></div>
      </div>

      <div class="pane" id="paneFriends" role="tabpanel" aria-labelledby="tabFriends" hidden>
        <div class="group-title">待处理请求</div>
        <div id="reqList"></div>
        <div class="group-title">好友</div>
        <div id="friendList"></div>
        <div class="new-conv">
          <button class="btn" id="addFriendBtn">
            <svg class="icon">
              <use href="#i-users" />
            </svg>
            添加好友
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="thread-head">
        <button class="btn btn-ghost back" id="backBtn" aria-label="返回会话列表">
          <svg class="icon">
            <use href="#i-back" />
          </svg>
        </button>
        <div style="min-width:0">
          <div class="peer" id="threadTitle">未选择对话</div>
          <div class="sub" id="threadSub"></div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 · Shift+Enter 换行"
          aria-label="消息内容" disabled></textarea>
        <button class="btn btn-primary" type="submit" id="sendBtn" disabled aria-label="发送">
          <svg class="icon">
            <use href="#i-send" />
          </svg>
        </button>
      </form>
    </main>
  </div>

  <!-- ============ new conversation / add friend ============ -->
  <dialog id="lookupDialog" aria-labelledby="lookupTitle">
    <div class="dlg-head">
      <span id="lookupTitle">开始新对话</span>
      <button class="btn btn-ghost" type="button" id="lookupClose" aria-label="关闭">
        <svg class="icon">
          <use href="#i-x" />
        </svg>
      </button>
    </div>
    <div class="dlg-body">
      <label class="field" style="margin:0">
        <span id="lookupLabel">按用户名搜索</span>
        <input type="text" id="lookupInput" autocomplete="off" spellcheck="false" placeholder="用户名">
      </label>
      <div class="results" id="lookupResults" role="listbox" aria-label="搜索结果"></div>
      <p class="hint" id="lookupHint">输入用户名后按 Enter 搜索</p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    /* =========================================================
     * Endpoints (all same-origin: this page is served from /event/)
     * =======================================================*/
    const API = {
      login: '/token/login',
      logout: '/token/logout',
      register: '/user/register',
      conversations: '/user/history',
      dmHistory: (uid) => `/user/${uid}/history`,
      dmSend: (uid) => `/user/${uid}/send`,
      groupHistory: (gid) => `/group/${gid}/history`,
      groupSend: (gid) => `/group/${gid}/send`,
      readIndex: '/ri',
      stream: (token) => `/event/stream?token=${encodeURIComponent(token)}`,
      findUser: (name) => `/user/find/${encodeURIComponent(name)}`,
      friends: '/friend',
      friendRequests: '/friend/req',
      friendRequest: (uid) => `/friend/req/${uid}`,
      friendReview: '/friend/req',
    };

    const PAGE_LIMIT = 50;
    /** The server's `Heartbeat` event is every 60s; the 5s keep-alive is an SSE
     *  comment, which the browser never surfaces to JS. So the only visible
     *  liveness signal is 60s apart — the watchdog must allow two of them. */
    const WATCHDOG_MS = 130000;

    /* =========================================================
     * State
     * =======================================================*/
    const state = {
      token: null,
      uid: null,
      name: null,
      conversations: [],          // {id, kind, peerUid|gid, title, preview, time, mid, unread}
      activeId: null,
      threads: new Map(),         // id -> {messages: [], loaded: false, loading: false}
      seen: new Map(),            // id -> Set<mid>
      readUpTo: new Map(),        // id -> mid
      friends: { list: [], pending: [], loaded: false },
      lookup: { mode: 'open', results: [], selected: -1, seq: 0 },
      connection: 'idle',         // idle | live | down
      view: 'list',
    };

    const $ = (id) => document.getElementById(id);

    /* =========================================================
     * Small helpers
     * =======================================================*/
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    /** The server's datetime_format is `%Y-%m-%d %H:%M:%S`, local, no zone. */
    function parseTime(text) {
      if (!text) return new Date(NaN);
      const date = new Date(String(text).replace(' ', 'T'));
      return Number.isNaN(date.getTime()) ? new Date() : date;
    }

    const pad = (n) => String(n).padStart(2, '0');

    function clockLabel(date) {
      return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function dayKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function dayLabel(date) {
      const today = new Date();
      const yesterday = new Date(today.getTime() - 86400000);
      if (dayKey(date) === dayKey(today)) return '今天';
      if (dayKey(date) === dayKey(yesterday)) return '昨天';
      return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
    }

    /** Relative for the list: time today, date before that. */
    function listTime(date) {
      if (!date || Number.isNaN(date.getTime())) return '';
      return dayKey(date) === dayKey(new Date())
        ? clockLabel(date)
        : `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function initials(name) {
      const trimmed = String(name || '?').trim();
      return trimmed ? [...trimmed][0].toUpperCase() : '?';
    }

    function excerpt(text, max = 60) {
      const flat = String(text || '').replace(/\s+/g, ' ').trim();
      return flat.length > max ? `${flat.slice(0, max - 1)}…` : flat;
    }

    const convKey = (kind, id) => `${kind === 'group' ? 'g' : 'u'}:${id}`;

    function convIdParts(id) {
      const [kind, raw] = String(id).split(':');
      return { kind: kind === 'g' ? 'group' : 'user', id: Number(raw) };
    }

    /* =========================================================
     * Transport
     * =======================================================*/
    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.status = status;
      }
    }

    /** Error bodies are usually plain text; validation errors arrive as a
     *  quoted JSON string. Unwrap the latter so the user reads words, not `"…"`. */
    function cleanError(text) {
      const raw = String(text || '').trim();
      if (!raw) return '';
      if (raw.startsWith('"') && raw.endsWith('"')) {
        try { return JSON.parse(raw); } catch { /* keep raw */ }
      }
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string') return parsed;
      } catch { /* not JSON */ }
      return raw;
    }

    async function api(path, { method = 'GET', body, auth = true } = {}) {
      const headers = {};
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      if (auth && state.token) headers['Authorization'] = `Bearer ${state.token}`;

      let response;
      try {
        response = await fetch(path, {
          method,
          headers,
          body: body === undefined ? undefined : JSON.stringify(body),
        });
      } catch {
        throw new ApiError('无法连接服务器', 0);
      }

      const text = await response.text();
      if (!response.ok) {
        if (response.status === 401 && auth) {
          sessionExpired();
          throw new ApiError('登录已过期，请重新登录', 401);
        }
        throw new ApiError(cleanError(text) || `请求失败（${response.status}）`, response.status);
      }
      return text;
    }

    async function apiJson(path, options) {
      const text = await api(path, options);
      return text ? JSON.parse(text) : null;
    }

    /* =========================================================
     * Auth
     * =======================================================*/
    function uidFromToken(token) {
      try {
        const segment = String(token).split('.')[1];
        if (!segment) return null;
        const padded = segment.replace(/-/g, '+').replace(/_/g, '/')
          .padEnd(Math.ceil(segment.length / 4) * 4, '=');
        const payload = JSON.parse(atob(padded));
        return typeof payload.id === 'number' ? payload.id : null;
      } catch {
        return null;
      }
    }

    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      const isLogin = mode === 'login';
      $('authSubmit').textContent = isLogin ? '登录' : '注册并登录';
      $('authSub').textContent = isLogin ? '登录后开始聊天。' : '注册一个账号，随后自动登录。';
      $('switchPrompt').textContent = isLogin ? '还没有账号？' : '已经有账号？';
      $('switchMode').textContent = isLogin ? '注册一个' : '去登录';
      $('authError').textContent = '';
      $('authPassword').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
    }

    async function submitAuth(event) {
      event.preventDefault();
      const name = $('authName').value.trim();
      const password = $('authPassword').value;
      const errorBox = $('authError');
      errorBox.textContent = '';

      if (!name || !password) {
        errorBox.textContent = '用户名和密码都不能为空';
        return;
      }

      const submit = $('authSubmit');
      submit.disabled = true;
      submit.textContent = authMode === 'login' ? '登录中…' : '注册中…';
      try {
        if (authMode === 'register') {
          await api(API.register, { method: 'POST', body: { name, password }, auth: false });
        }
        const session = await apiJson(API.login, {
          method: 'POST',
          body: { name, password },
          auth: false,
        });
        const token = session?.access_token;
        if (!token) throw new ApiError('服务端没有返回令牌', 0);
        const uid = uidFromToken(token);
        if (uid === null) throw new ApiError('令牌里没有用户标识，无法确定当前用户', 0);

        await startSession(token, uid, name);
      } catch (error) {
        errorBox.textContent = error.message;
        submit.disabled = false;
        submit.textContent = authMode === 'login' ? '登录' : '注册并登录';
      }
    }

    async function startSession(token, uid, name) {
      state.token = token;
      state.uid = uid;
      state.name = name;
      sessionStorage.setItem('chat.token', token);
      sessionStorage.setItem('chat.name', name);
      $('auth').hidden = true;
      $('app').hidden = false;
      $('meName').textContent = name;
      setConnection('idle');
      applyView();
      await refreshConversations();
      renderThread();
      connectStream();
    }

    function sessionExpired() {
      closeStream();
      state.token = null;
      state.uid = null;
      state.conversations = [];
      state.threads.clear();
      state.seen.clear();
      state.readUpTo.clear();
      state.activeId = null;
      sessionStorage.removeItem('chat.token');
      sessionStorage.removeItem('chat.name');
      $('app').hidden = true;
      $('auth').hidden = false;
      $('authPassword').value = '';
      $('authError').textContent = '登录已过期，请重新登录';
      $('authSubmit').disabled = false;
      $('authSubmit').textContent = '登录';
    }

    async function logout() {
      try {
        if (state.token) await api(API.logout, { method: 'DELETE' });
      } catch { /* best effort */ }
      sessionExpired();
      $('authError').textContent = '';
    }

    /* =========================================================
     * Conversations
     * =======================================================*/
    function toConversation(row) {
      const [kind, data] = Object.entries(row)[0] || [];
      if (!data) return null;
      const time = parseTime(data.msg_time);
      if (kind === 'User') {
        return {
          id: convKey('user', data.uid),
          kind: 'user',
          uid: data.uid,
          gid: null,
          title: data.user_name || `用户 ${data.uid}`,
          preview: data.msg || '',
          time,
          mid: data.mid,
          unread: data.unread,
        };
      }
      if (kind === 'Group') {
        return {
          id: convKey('group', data.gid),
          kind: 'group',
          uid: null,
          gid: data.gid,
          title: data.group_name || `群聊 #${data.gid}`,
          preview: data.msg ? `${data.user_name || '?'}：${data.msg}` : '',
          time,
          mid: data.mid,
          unread: data.unread,
        };
      }
      return null;
    }

    function sortConversations() {
      state.conversations.sort((a, b) => b.time - a.time);
    }

    async function refreshConversations() {
      try {
        const rows = await apiJson(API.conversations, {
          method: 'POST',
          body: { page: 1, limit: PAGE_LIMIT },
        });
        state.conversations = (rows || []).map(toConversation).filter(Boolean);
        sortConversations();
        renderConversations();
      } catch (error) {
        if (error.status !== 401) toast(error.message, 'error');
      }
    }

    function conversationById(id) {
      return state.conversations.find((conversation) => conversation.id === id) || null;
    }

    function threadOf(id) {
      if (!state.threads.has(id)) {
        state.threads.set(id, { messages: [], loaded: false, loading: false });
      }
      return state.threads.get(id);
    }

    function seenOf(id) {
      if (!state.seen.has(id)) state.seen.set(id, new Set());
      return state.seen.get(id);
    }

    async function openConversation(id) {
      state.activeId = id;
      state.view = 'thread';
      applyView();
      renderThread();
      await loadHistory(id);
      reportRead(id);
    }

    async function loadHistory(id) {
      const thread = threadOf(id);
      if (thread.loading) return;
      thread.loading = true;
      renderThread();
      const { kind, id: raw } = convIdParts(id);
      try {
        const path = kind === 'user' ? API.dmHistory(raw) : API.groupHistory(raw);
        const rows = await apiJson(path) || [];
        const seen = seenOf(id);
        thread.messages = rows.map((row) => ({
          mid: row.mid,
          uid: row.from_uid,
          name: kind === 'user' ? row.from_name : row.name_of_from_uid,
          body: row.msg,
          time: parseTime(row.time),
          mine: row.from_uid === state.uid,
          pending: false,
          failed: false,
        }));
        thread.messages.forEach((message) => seen.add(message.mid));
        thread.loaded = true;
      } catch (error) {
        if (error.status !== 401) toast(error.message, 'error');
      } finally {
        thread.loading = false;
        renderThread();
      }
    }

    /* =========================================================
     * Sending
     * =======================================================*/
    let localSeq = 0;

    async function sendMessage() {
      const input = $('input');
      const body = input.value.replace(/\s+$/, '');
      if (!body.trim() || !state.activeId) return;

      const id = state.activeId;
      const { kind, id: raw } = convIdParts(id);
      const thread = threadOf(id);
      const optimistic = {
        mid: null,
        localId: `local-${++localSeq}`,
        uid: state.uid,
        name: state.name,
        body,
        time: new Date(),
        mine: true,
        pending: true,
        failed: false,
      };
      thread.messages.push(optimistic);
      input.value = '';
      autoGrow(input);
      renderThread({ stick: true });

      try {
        const path = kind === 'user' ? API.dmSend(raw) : API.groupSend(raw);
        const midText = await api(path, { method: 'PUT', body: { msg: body } });
        const mid = Number(String(midText).trim());
        optimistic.mid = Number.isFinite(mid) ? mid : null;
        optimistic.pending = false;
        if (optimistic.mid !== null) seenOf(id).add(optimistic.mid);
        touchConversation(id, optimistic);
        reportRead(id);
      } catch (error) {
        optimistic.pending = false;
        optimistic.failed = true;
        optimistic.error = error.message;
        renderThread();
        if (error.status !== 401) toast(error.message, 'error');
      }
    }

    /** Local echo of a conversation's summary, so the list keeps up before the
     *  server's refresh lands. */
    function touchConversation(id, message) {
      const conversation = conversationById(id);
      if (!conversation) {
        refreshConversations();
        return;
      }
      if (message.mid !== null && conversation.mid !== null && message.mid < conversation.mid) return;
      conversation.preview = message.mine ? message.body : `${message.name}：${message.body}`;
      conversation.time = message.time;
      if (message.mid !== null) conversation.mid = message.mid;
      sortConversations();
      renderConversations();
    }

    /* =========================================================
     * Read positions
     * =======================================================*/
    async function reportRead(id) {
      const thread = threadOf(id);
      const newest = [...thread.messages].reverse().find((m) => m.mid !== null);
      if (!newest) return;

      const last = state.readUpTo.get(id) ?? -1;
      if (newest.mid <= last) return;
      state.readUpTo.set(id, newest.mid);

      const { kind, id: raw } = convIdParts(id);
      const body = kind === 'user'
        ? { User: { target_uid: raw, mid: newest.mid } }
        : { Group: { target_gid: raw, mid: newest.mid } };

      try {
        await api(API.readIndex, { method: 'PUT', body });
        const conversation = conversationById(id);
        if (conversation && conversation.id === id) conversation.unread = null;
        renderConversations();
      } catch (error) {
        // A failed report must not block the user; roll the position back so a
        // later event retries it.
        if ((state.readUpTo.get(id) ?? 0) === newest.mid) state.readUpTo.delete(id);
        if (error.status !== 401) toast(`已读状态同步失败：${error.message}`, 'error');
      }
    }

    /* =========================================================
     * Push link
     * =======================================================*/
    let stream = null;
    let watchdog = null;
    let retryTimer = null;
    let everConnected = false;

    function setConnection(value) {
      state.connection = value;
      const dot = $('connDot');
      const text = $('connText');
      dot.dataset.state = value === 'live' ? 'live' : value === 'down' ? 'down' : 'idle';
      text.textContent = value === 'live' ? '已连接' : value === 'down' ? '连接断开，正在重连' : '未连接';
    }

    function resetWatchdog() {
      clearTimeout(watchdog);
      watchdog = setTimeout(() => {
        // Nothing arrived for two heartbeat periods: the socket is probably
        // half-open. EventSource will not notice by itself.
        connectStream();
      }, WATCHDOG_MS);
    }

    function closeStream() {
      clearTimeout(watchdog);
      clearTimeout(retryTimer);
      if (stream) {
        stream.close();
        stream = null;
      }
      setConnection('idle');
    }

    function connectStream() {
      closeStream();
      if (!state.token) return;
      setConnection(state.connection === 'live' ? 'live' : 'idle');

      const source = new EventSource(API.stream(state.token));
      stream = source;

      source.addEventListener('open', () => {
        const reconnected = everConnected;
        everConnected = true;
        setConnection('live');
        resetWatchdog();
        if (reconnected) {
          // Messages missed while the link was down are not replayed.
          refreshConversations();
          if (state.activeId) loadHistory(state.activeId);
        }
      });

      source.addEventListener('Chat', (event) => {
        resetWatchdog();
        let envelope;
        try {
          envelope = JSON.parse(event.data);
        } catch {
          return;
        }
        // The server wraps the payload in its externally tagged `Message` enum.
        const message = envelope?.ChatMessage;
        if (message) handleIncoming(message);
      });

      source.addEventListener('Heartbeat', () => resetWatchdog());

      source.addEventListener('error', () => {
        setConnection('down');
        // EventSource retries on its own for transport errors, but a failed
        // handshake (bad token, proxy) closes it for good.
        if (source.readyState === EventSource.CLOSED) {
          clearTimeout(retryTimer);
          retryTimer = setTimeout(connectStream, 3000);
        }
      });
    }

    function handleIncoming(message) {
      const payload = message.payload;
      if (!payload) return;
      const mine = payload.from_uid === state.uid;
      const target = payload.target || {};
      const isGroup = Object.prototype.hasOwnProperty.call(target, 'Group');
      const id = isGroup
        ? convKey('group', target.Group.gid)
        : convKey('user', mine ? target.User.uid : payload.from_uid);

      const seen = seenOf(id);
      if (seen.has(message.mid)) return;
      seen.add(message.mid);

      const text = payload.detail?.Normal?.content?.content ?? '';
      const entry = {
        mid: message.mid,
        uid: payload.from_uid,
        name: mine ? state.name : (conversationById(id)?.title || `用户 ${payload.from_uid}`),
        body: text,
        time: parseTime(payload.created_at),
        mine,
        pending: false,
        failed: false,
      };

      const thread = threadOf(id);
      thread.messages.push(entry);
      if (state.activeId === id) {
        renderThread({ stick: true });
        reportRead(id);
      }

      const conversation = conversationById(id);
      if (conversation) {
        conversation.mid = Math.max(conversation.mid ?? 0, entry.mid);
        conversation.preview = mine ? text : `${entry.name}：${text}`;
        conversation.time = entry.time;
        if (!mine && state.activeId !== id) {
          const count = typeof conversation.unread === 'number' ? conversation.unread : 0;
          conversation.unread = count + 1;
        }
        sortConversations();
        renderConversations();
      } else {
        refreshConversations();
      }
    }

    /* =========================================================
     * Friends
     * =======================================================*/
    async function loadFriends() {
      try {
        const [friends, requests] = await Promise.all([
          apiJson(API.friends),
          apiJson(API.friendRequests),
        ]);
        state.friends.list = friends || [];
        state.friends.pending = (requests || []).filter((r) => r.status === 'WAIT');
        state.friends.loaded = true;
        renderFriends();
      } catch (error) {
        if (error.status !== 401) toast(error.message, 'error');
      }
    }

    async function addFriend(uid, name) {
      try {
        await api(API.friendRequest(uid), { method: 'POST', body: { reason: null } });
        toast(`已向 ${name} 发送好友请求`);
        loadFriends();
      } catch (error) {
        // 201 carries "already a friend" / "request already waiting": that is
        // information, not a failure.
        if (error.status === 201) toast(error.message);
        else if (error.status !== 401) toast(error.message, 'error');
      }
    }

    async function reviewFriend(id, approve) {
      try {
        await api(API.friendReview, {
          method: 'POST',
          body: { id, status: approve ? 'APPROVE' : 'REJECT' },
        });
        toast(approve ? '已通过请求' : '已拒绝请求');
        loadFriends();
      } catch (error) {
        if (error.status !== 401) toast(error.message, 'error');
      }
    }

    /* =========================================================
     * Lookup dialog
     * =======================================================*/
    function openLookup(mode) {
      state.lookup = { mode, results: [], selected: -1, seq: 0 };
      $('lookupTitle').textContent = mode === 'open' ? '开始新对话' : '添加好友';
      $('lookupLabel').textContent = mode === 'open' ? '按用户名搜索，选中即可开始对话' : '按用户名搜索，选中即可发送请求';
      $('lookupInput').value = '';
      $('lookupResults').innerHTML = '';
      $('lookupHint').textContent = '输入用户名后按 Enter 搜索';
      $('lookupDialog').showModal();
      $('lookupInput').focus();
    }

    async function runLookup() {
      const query = $('lookupInput').value.trim();
      if (!query) return;
      const seq = ++state.lookup.seq;
      $('lookupHint').textContent = '搜索中…';
      try {
        const results = (await apiJson(API.findUser(query))) || [];
        if (seq !== state.lookup.seq) return; // a newer search superseded this one
        state.lookup.results = results.filter((user) => user.id !== state.uid);
        state.lookup.selected = state.lookup.results.length ? 0 : -1;
        renderLookup();
      } catch (error) {
        if (seq !== state.lookup.seq) return;
        $('lookupHint').textContent = error.message;
      }
    }

    function renderLookup() {
      const { results, selected } = state.lookup;
      const box = $('lookupResults');
      box.innerHTML = results.map((user, index) => `
        <button class="result" role="option" data-uid="${user.id}" data-name="${esc(user.name)}"
                aria-selected="${index === selected}">
          <span class="avatar">${esc(initials(user.name))}</span>
          <span class="n">${esc(user.name)}</span>
          <span class="time">#${user.id}</span>
        </button>`).join('');

      box.querySelectorAll('.result').forEach((node) => {
        node.addEventListener('mouseenter', () => {
          state.lookup.selected = Number(node.dataset.uid) === -1 ? -1 : [...box.children].indexOf(node);
          renderLookup();
        });
        node.addEventListener('click', () => chooseLookup(node.dataset.uid, node.dataset.name));
      });

      $('lookupHint').textContent = results.length
        ? '↑↓ 选择 · Enter 确认 · Esc 关闭'
        : '没有匹配的用户';
    }

    function chooseLookup(uid, name) {
      $('lookupDialog').close();
      if (state.lookup.mode === 'add') {
        addFriend(Number(uid), name);
        return;
      }
      const id = convKey('user', Number(uid));
      if (!conversationById(id)) {
        state.conversations.push({
          id, kind: 'user', uid: Number(uid), gid: null,
          title: name, preview: '', time: new Date(0), mid: 0, unread: null,
        });
        sortConversations();
        renderConversations();
      }
      state.view = 'thread';
      openConversation(id);
    }

    /* =========================================================
     * Rendering
     * =======================================================*/
    function applyView() {
      const app = $('app');
      app.dataset.view = window.matchMedia('(max-width: 760px)').matches ? state.view : 'split';
    }

    function renderConversations() {
      const box = $('convList');
      if (!state.conversations.length) {
        box.innerHTML = `
          <div class="empty">
            <strong>还没有会话</strong>
            <span>用「开始新对话」按用户名找到一个人。</span>
          </div>`;
        return;
      }
      box.innerHTML = state.conversations.map((conversation) => {
        const unread = conversation.unread;
        const badge = typeof unread === 'number'
          ? `<span class="badge">${unread}</span>`
          : unread === 'all'
            ? '<span class="badge" title="全部未读">全部</span>'
            : '';
        return `
          <button class="conv" data-id="${conversation.id}"
                  aria-current="${conversation.id === state.activeId}"
                  data-unread="${Boolean(unread)}">
            <span class="title">${esc(conversation.title)}</span>
            <span class="time">${badge || listTime(conversation.time)}</span>
            <span class="preview">${esc(excerpt(conversation.preview))}</span>
          </button>`;
      }).join('');

      box.querySelectorAll('.conv').forEach((node) => {
        node.addEventListener('click', () => {
          state.view = 'thread';
          openConversation(node.dataset.id);
        });
      });
    }

    function renderThread(options = {}) {
      const container = $('messages');
      const id = state.activeId;
      const header = $('threadTitle');
      const sub = $('threadSub');
      const input = $('input');
      const send = $('sendBtn');

      if (!id) {
        header.textContent = '未选择对话';
        sub.textContent = '';
        container.innerHTML = `
          <div class="empty">
            <strong>选择一个对话</strong>
            <span>左侧列表里挑一个人，或者用「开始新对话」找人。</span>
          </div>`;
        input.disabled = true;
        send.disabled = true;
        return;
      }

      const conversation = conversationById(id);
      header.textContent = conversation?.title || '对话';
      sub.textContent = conversation?.kind === 'group' ? '群聊' : '私聊';
      input.disabled = false;
      send.disabled = false;

      const thread = threadOf(id);
      if (thread.loading && !thread.messages.length) {
        container.innerHTML = '<div class="empty"><strong>加载聊天记录…</strong></div>';
        return;
      }
      if (!thread.messages.length) {
        container.innerHTML = `
          <div class="empty">
            <strong>还没有消息</strong>
            <span>在下面输入，Enter 发送。</span>
          </div>`;
        return;
      }

      const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
      const rows = [];
      let previousDay = null;
      let previousSender = null;
      let previousTime = 0;

      for (const message of thread.messages) {
        const key = dayKey(message.time);
        if (key !== previousDay) {
          previousDay = key;
          previousSender = null;
          rows.push(`<div class="day">${esc(dayLabel(message.time))}</div>`);
        }
        const sameSender = previousSender === message.uid;
        const close = sameSender && (message.time.getTime() - previousTime) < 5 * 60 * 1000;
        previousSender = message.uid;
        previousTime = message.time.getTime();

        const meta = close ? '' : `
          <div class="meta">
            <span class="who">${esc(message.mine ? '我' : message.name)}</span>
            <time>${clockLabel(message.time)}</time>
          </div>`;

        const failure = message.failed
          ? `<div class="fail-note">
               <span>${esc(message.error || '发送失败')}</span>
               <button class="link" type="button" data-retry="${message.localId}">重试</button>
             </div>`
          : '';

        rows.push(`
          <div class="msg" data-mine="${message.mine}" data-grouped="${close}"
               data-pending="${message.pending}" data-failed="${message.failed}">
            <span class="avatar" aria-hidden="true">${esc(initials(message.mine ? state.name : message.name))}</span>
            <div class="bubble">
              ${meta}
              <div class="text">${esc(message.body)}</div>
              ${failure}
            </div>
          </div>`);
      }

      container.innerHTML = rows.join('');
      container.querySelectorAll('[data-retry]').forEach((node) => {
        node.addEventListener('click', () => retryMessage(node.dataset.retry));
      });

      if (options.stick || nearBottom) container.scrollTop = container.scrollHeight;
    }

    function retryMessage(localId) {
      const thread = threadOf(state.activeId);
      const index = thread.messages.findIndex((message) => message.localId === localId);
      if (index === -1) return;
      const body = thread.messages[index].body;
      thread.messages.splice(index, 1);
      $('input').value = body;
      autoGrow($('input'));
      renderThread();
      sendMessage();
    }

    function renderFriends() {
      const requests = $('reqList');
      const friends = $('friendList');

      if (!state.friends.pending.length) {
        requests.innerHTML = '<p class="hint">没有待处理的请求</p>';
      } else {
        requests.innerHTML = state.friends.pending.map((request) => `
          <div class="req-row">
            <span class="avatar">${esc(initials(request.request_name))}</span>
            <span class="n">${esc(request.request_name)}
              ${request.reason ? `<span class="reason">${esc(request.reason)}</span>` : ''}
            </span>
            <span class="row-actions">
              <button class="btn btn-primary" data-approve="${request.id}" aria-label="通过">
                <svg class="icon"><use href="#i-check" /></svg>
              </button>
              <button class="btn" data-reject="${request.id}" aria-label="拒绝">
                <svg class="icon"><use href="#i-x" /></svg>
              </button>
            </span>
          </div>`).join('');
        requests.querySelectorAll('[data-approve]').forEach((node) =>
          node.addEventListener('click', () => reviewFriend(Number(node.dataset.approve), true)));
        requests.querySelectorAll('[data-reject]').forEach((node) =>
          node.addEventListener('click', () => reviewFriend(Number(node.dataset.reject), false)));
      }

      if (!state.friends.list.length) {
        friends.innerHTML = '<p class="hint">还没有好友，用「添加好友」找一个人</p>';
      } else {
        friends.innerHTML = state.friends.list.map((friend) => `
          <div class="friend-row">
            <span class="avatar">${esc(initials(friend.name))}</span>
            <span class="n">${esc(friend.name)}</span>
            <button class="btn" data-open="${friend.id}" data-name="${esc(friend.name)}">聊天</button>
          </div>`).join('');
        friends.querySelectorAll('[data-open]').forEach((node) =>
          node.addEventListener('click', () => {
            state.view = 'thread';
            const id = convKey('user', Number(node.dataset.open));
            if (!conversationById(id)) {
              state.conversations.push({
                id, kind: 'user', uid: Number(node.dataset.open), gid: null,
                title: node.dataset.name, preview: '', time: new Date(0), mid: 0, unread: null,
              });
              sortConversations();
              renderConversations();
            }
            openConversation(id);
          }));
      }
    }

    let toastTimer = null;

    function toast(message, kind = 'info') {
      const node = $('toast');
      node.textContent = message;
      node.dataset.kind = kind;
      node.dataset.show = 'true';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.dataset.show = 'false'; }, 3600);
    }

    function autoGrow(node) {
      node.style.height = 'auto';
      node.style.height = `${Math.min(node.scrollHeight, 160)}px`;
    }

    /* =========================================================
     * Wiring
     * =======================================================*/
    $('authForm').addEventListener('submit', submitAuth);
    $('switchMode').addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));
    $('logoutBtn').addEventListener('click', logout);
    $('backBtn').addEventListener('click', () => { state.view = 'list'; applyView(); });
    $('newConvBtn').addEventListener('click', () => openLookup('open'));
    $('addFriendBtn').addEventListener('click', () => openLookup('add'));
    $('lookupClose').addEventListener('click', () => $('lookupDialog').close());

    $('lookupInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        const { results, selected } = state.lookup;
        if (results.length && selected >= 0) chooseLookup(results[selected].id, results[selected].name);
        else runLookup();
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const { results } = state.lookup;
        if (!results.length) return;
        const delta = event.key === 'ArrowDown' ? 1 : -1;
        state.lookup.selected = (state.lookup.selected + delta + results.length) % results.length;
        renderLookup();
      }
    });

    $('composer').addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });

    $('input').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    $('input').addEventListener('input', (event) => autoGrow(event.target));

    $('tabChats').addEventListener('click', () => switchTab('chats'));
    $('tabFriends').addEventListener('click', () => switchTab('friends'));

    function switchTab(tab) {
      const chats = tab === 'chats';
      $('tabChats').setAttribute('aria-selected', String(chats));
      $('tabFriends').setAttribute('aria-selected', String(!chats));
      $('paneChats').hidden = !chats;
      $('paneFriends').hidden = chats;
      if (!chats) loadFriends();
    }

    window.addEventListener('resize', applyView);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.view === 'thread' && window.matchMedia('(max-width: 760px)').matches) {
        state.view = 'list';
        applyView();
      }
    });

    /* =========================================================
     * Boot
     * =======================================================*/
    (function boot() {
      setAuthMode('login');
      const savedToken = sessionStorage.getItem('chat.token');
      const savedName = sessionStorage.getItem('chat.name');
      if (savedToken && savedName) {
        const uid = uidFromToken(savedToken);
        if (uid !== null) {
          startSession(savedToken, uid, savedName).catch(() => sessionExpired());
          return;
        }
        sessionStorage.clear();
      }
      $('authName').focus();
    })();
  </script>
</body>

</html>
