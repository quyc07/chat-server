services:
  chat-server:
    build: .
    image: chat-server:1.0
    container_name: chat-server
    ports:
      - "3000:3000"
    volumes:
      - ./volume/data:/app/data
    environment:
      # compose loads .env from this directory; fail loudly instead of falling
      # back to the hardcoded key in src/auth.rs.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or the environment}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
